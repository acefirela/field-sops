<style>:root{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: one phone-width column. Home is a stack of numbered job tags, most common job first.
   An SOP is a top bar, its parts in reading order, and a player docked at the bottom. */
:root {
  --bg: #ECEFF1;        /* galvanized steel grey */
  --surface: #FFFFFF;
  --ink: #14181B;
  --muted: #56616A;
  --line: #D3D9DD;
  --red: #B81D2A;       /* riser red: buttons and fills */
  --on-red: #FFFFFF;
  --red-text: #B81D2A;  /* red used as text on a surface */
  --red-soft: #F7E4E5;
  --tag: #F5C518;       /* out-of-service tag yellow: safety rules only */
  --tag-ink: #231C00;
  --font-display: "Barlow Condensed", "Arial Narrow", Arial, sans-serif;
  --font-body: "Barlow", "Segoe UI", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1214; --surface: #191E21; --ink: #EDF0F1; --muted: #9BA6AD; --line: #2B3237;
    --red: #D7323E; --on-red: #FFFFFF; --red-text: #FF7A82; --red-soft: #33191C;
    --tag: #F5C518; --tag-ink: #231C00; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1214; --surface: #191E21; --ink: #EDF0F1; --muted: #9BA6AD; --line: #2B3237;
  --red: #D7323E; --on-red: #FFFFFF; --red-text: #FF7A82; --red-soft: #33191C;
  --tag: #F5C518; --tag-ink: #231C00; color-scheme: dark;
}

html { -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 17px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
* { box-sizing: border-box; }
h1, h2, h3, p, ul, ol { margin: 0; }
ul, ol { padding: 0; list-style: none; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible, input:focus-visible { outline: 3px solid var(--red-text); outline-offset: 2px; }
svg { display: block; }

.wrap { max-width: 680px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* language switch */
.lang { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); padding: 3px; flex: none; }
.lang button { border: 0; background: transparent; border-radius: 999px; min-width: 46px; min-height: 38px; padding: 0 12px; font-weight: 600; font-size: 15px; color: var(--muted); }
.lang button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }

/* home */
.home-top { background: var(--surface); border-bottom: 1px solid var(--line); }
.home-top .wrap { padding-block: 18px 22px; display: flex; flex-direction: column; gap: 14px; }
.brand-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 15px; letter-spacing: .02em; }
.mark { width: 34px; height: 34px; border-radius: 50%; background: var(--red); color: var(--on-red); display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; font-size: 15px; letter-spacing: .03em; }
.home-top h1 { font-family: var(--font-display); font-weight: 700; font-size: 44px; line-height: 1; text-wrap: balance; }
.lead { color: var(--muted); max-width: 34em; }

.draft { border: 1.5px dashed var(--muted); border-radius: 10px; padding: 10px 12px; font-size: 15px; line-height: 1.4; color: var(--ink); }
.draft b { font-family: var(--font-display); font-size: 17px; letter-spacing: .06em; text-transform: uppercase; margin-right: 6px; }

.home-list { padding-block: 18px 40px; display: flex; flex-direction: column; gap: 10px; }
.group { font-family: var(--font-display); font-weight: 600; font-size: 16px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-top: 8px; }
.jobtag { display: flex; align-items: center; gap: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; text-decoration: none; color: inherit; min-width: 0; }
.jobtag:active { background: var(--red-soft); }
.stamp { flex: none; width: 52px; height: 52px; border-radius: 50%; border: 2px solid var(--ink); display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; font-size: 24px; font-variant-numeric: tabular-nums; }
.jobtag .txt { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 3px; }
.jobtag .ttl { font-weight: 600; font-size: 18px; line-height: 1.25; text-wrap: balance; }
.meta { color: var(--muted); font-size: 14.5px; font-variant-numeric: tabular-nums; }
.chev { flex: none; color: var(--muted); }

/* SOP view */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.bar .wrap { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-block: 8px; }
.back { display: inline-flex; align-items: center; gap: 4px; min-height: 44px; padding: 0 12px 0 6px; border-radius: 999px; text-decoration: none; color: var(--ink); font-weight: 600; font-size: 16px; }
.sop-head { padding-block: 20px 6px; display: flex; flex-direction: column; gap: 14px; }
.eyebrow { font-family: var(--font-display); font-weight: 600; font-size: 16px; letter-spacing: .1em; text-transform: uppercase; color: var(--red-text); font-variant-numeric: tabular-nums; }
.sop-head h1 { font-family: var(--font-display); font-weight: 700; font-size: 38px; line-height: 1.02; text-wrap: balance; }
.btn-main { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; min-height: 56px; border: 0; border-radius: 12px; background: var(--red); color: var(--on-red); font-weight: 600; font-size: 18px; padding: 10px 16px; }
.btn-main:active { filter: brightness(.92); }
.toc { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.toc button { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 48px; padding: 8px 14px; border: 0; border-top: 1px solid var(--line); background: transparent; text-align: left; }
.toc li:first-child button { border-top: 0; }
.toc button.on { background: var(--red-soft); }
.toc button.on .h { font-weight: 600; }
.toc .n { flex: none; width: 1.3em; font-family: var(--font-display); font-weight: 700; font-size: 20px; color: var(--red-text); font-variant-numeric: tabular-nums; }
.toc .h { flex: 1; min-width: 0; font-weight: 500; }
.toc .d { flex: none; color: var(--muted); font-size: 14.5px; font-variant-numeric: tabular-nums; }

.parts { padding-block: 10px 48px; display: flex; flex-direction: column; gap: 14px; }
.part { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 14px; scroll-margin-top: calc(env(safe-area-inset-top, 0px) + 72px); min-width: 0; }
.part.is-playing { border-color: var(--red-text); box-shadow: 0 0 0 1px var(--red-text); }
.part-head { display: flex; align-items: center; gap: 12px; }
.part-head .pn { flex: none; font-family: var(--font-display); font-weight: 700; font-size: 34px; line-height: 1; color: var(--red-text); font-variant-numeric: tabular-nums; }
.part-head h2 { flex: 1; min-width: 0; font-family: var(--font-display); font-weight: 700; font-size: 28px; line-height: 1.05; text-wrap: balance; }
.listen { flex: none; display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 14px 0 10px; border-radius: 999px; border: 1.5px solid var(--red-text); background: transparent; color: var(--red-text); font-weight: 600; font-size: 15px; }
.part.is-playing .listen { background: var(--red); border-color: var(--red); color: var(--on-red); }
.part p { max-width: 65ch; }
.part h3 { font-family: var(--font-display); font-weight: 600; font-size: 19px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-top: 4px; }
.note { background: var(--tag); color: var(--tag-ink); border-radius: 10px; padding: 12px 14px; font-weight: 500; }
.steps { display: flex; flex-direction: column; gap: 12px; }
.steps li { display: flex; gap: 12px; align-items: flex-start; }
.steps .sn { flex: none; width: 30px; height: 30px; border-radius: 50%; background: var(--red-soft); color: var(--red-text); display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; font-size: 18px; font-variant-numeric: tabular-nums; margin-top: 1px; }
.steps .st { flex: 1; min-width: 0; max-width: 65ch; }
.dots { display: flex; flex-direction: column; gap: 8px; }
.dots li { position: relative; padding-left: 20px; max-width: 65ch; }
.dots li::before { content: ""; position: absolute; left: 4px; top: .62em; width: 7px; height: 7px; background: var(--muted); border-radius: 1px; }
.fixes { display: flex; flex-direction: column; gap: 10px; }
.fix { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
.fix .q { font-weight: 600; }
.fix .a { color: var(--ink); }
.fix .lbl { display: block; font-family: var(--font-display); font-weight: 600; font-size: 14px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.state { padding-block: 40px; color: var(--muted); text-align: center; }

/* pictures */
.ceiling { display: block; width: 100%; height: 44px; color: var(--ink); }
.pipe { fill: var(--red); }
.ico { flex: none; width: 52px; height: 52px; border-radius: 12px; background: var(--red-soft); color: var(--red-text); display: grid; place-items: center; }
.no { font-family: var(--font-display); font-weight: 700; font-size: 15px; letter-spacing: .08em; color: var(--muted); font-variant-numeric: tabular-nums; }
.eyerow { display: flex; align-items: center; gap: 10px; }
.eyerow .ico { width: 42px; height: 42px; border-radius: 10px; }
.fig { margin: 0; border: 1px solid var(--line); border-radius: 12px; background: var(--bg); padding: 14px 12px 12px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.fig figcaption { color: var(--muted); font-size: 14.5px; line-height: 1.4; }
.dia { display: block; width: 100%; height: auto; max-width: 440px; margin: 0 auto; color: var(--ink); }
.dia .ink { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.dia .solid { fill: currentColor; }
.dia .body { fill: var(--surface); stroke: currentColor; stroke-width: 2; }
.dia .hair { fill: none; stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 4 4; }
.dia .drip { fill: none; stroke: var(--muted); stroke-width: 2; stroke-linecap: round; }
.dia .ghost { fill: none; stroke: var(--muted); stroke-width: 2; stroke-dasharray: 3 3; stroke-linecap: round; }
.dia .onpipe { fill: none; stroke: var(--on-red); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.dia .num circle { fill: var(--ink); }
.dia .num text { fill: var(--bg); font-family: var(--font-body); font-weight: 700; font-size: 12px; }
.legend { display: flex; flex-direction: column; gap: 8px; font-size: 15px; line-height: 1.35; }
.legend li { display: flex; gap: 10px; align-items: flex-start; }
.legend .ln { flex: none; width: 22px; height: 22px; border-radius: 50%; background: var(--ink); color: var(--bg); display: grid; place-items: center; font-weight: 700; font-size: 12.5px; margin-top: 1px; }
.tl { display: flex; flex-direction: column; padding-left: 4px; }
.stop { position: relative; padding: 0 0 18px 34px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.stop:last-child { padding-bottom: 0; }
.stop::before { content: ""; position: absolute; top: 2px; left: 0; width: 18px; height: 18px; box-sizing: border-box; border-radius: 50%; background: var(--surface); border: 3px solid var(--ink); z-index: 1; }
.stop.hot::before { background: var(--red); border-color: var(--red); }
.stop:not(:last-child)::after { content: ""; position: absolute; top: 12px; bottom: -6px; left: 8px; width: 2px; background: var(--muted); }
.tl.batt .stop:not(:last-child)::after { left: 5px; width: 8px; background: var(--tag); }
.stop b, .trio b, .node b, .order b { font-family: var(--font-display); font-weight: 700; font-size: 17.5px; line-height: 1.15; overflow-wrap: break-word; }
.stop span, .trio span, .node span, .order .tx span { font-size: 14.5px; line-height: 1.3; color: var(--muted); }
.trio { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; text-align: center; }
.trio b, .trio span, .node b, .node span { display: block; }
.flow { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 10px; align-items: stretch; }
.node { border: 1.5px solid var(--ink); border-radius: 10px; background: var(--surface); padding: 10px 8px; text-align: center; min-width: 0; }
.node.hot { border-color: var(--red-text); box-shadow: inset 0 0 0 1px var(--red-text); }
.node.wide, .arr.wide { grid-column: 1 / -1; }
.arr { display: grid; place-items: center; }
.arr svg { transform: rotate(90deg); }
.sigs { display: flex; flex-direction: column; gap: 10px; }
.sigs li { display: flex; gap: 10px; align-items: flex-start; }
.sigs .dot { flex: none; width: 16px; height: 16px; border-radius: 50%; margin-top: 4px; }
.sigs .dot.a { background: var(--red); } .sigs .dot.s { background: var(--tag); } .sigs .dot.t { background: var(--muted); }
.sigs b { display: block; }
.visits { display: flex; flex-direction: column; gap: 8px; }
.visits .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.visits .lab { font-weight: 600; }
.visits .chips { display: flex; gap: 6px; }
.chip { min-width: 40px; height: 34px; padding: 0 10px; border-radius: 8px; border: 1.5px solid var(--line); color: var(--muted); display: inline-grid; place-items: center; font-family: var(--font-display); font-weight: 700; font-size: 18px; }
.chip.on { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.visits .vkey { color: var(--muted); font-size: 14px; }
.order { display: flex; flex-direction: column; gap: 8px; }
.order .tile { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: flex; align-items: center; gap: 12px; min-width: 0; }
.order .tx { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.order .ic { flex: none; width: 44px; height: 44px; border-radius: 50%; background: var(--red-soft); color: var(--red-text); display: grid; place-items: center; }

/* install card (web app only) */
.inst { background: var(--surface); border: 1.5px solid var(--red-text); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 10px; text-align: left; }
.inst h2 { font-family: var(--font-display); font-weight: 700; font-size: 22px; line-height: 1.1; }
.inst p { color: var(--muted); font-size: 15.5px; line-height: 1.4; }
.inst ol { display: flex; flex-direction: column; gap: 8px; font-size: 16.5px; font-weight: 500; }
.inst ol li { display: flex; align-items: center; gap: 10px; }
.inst ol .n { flex: none; width: 26px; height: 26px; border-radius: 50%; background: var(--ink); color: var(--bg); display: grid; place-items: center; font-weight: 700; font-size: 14px; }
.inst ol svg { flex: none; color: var(--red-text); }
.inst .later { align-self: center; min-height: 44px; padding: 0 12px; border: 0; background: none; color: var(--muted); font-size: 15px; text-decoration: underline; }

/* crew code */
.lock-in { max-width: 440px; padding-block: 18px 40px; display: flex; flex-direction: column; gap: 14px; }
.lock-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.lock h1 { font-family: var(--font-display); font-weight: 700; font-size: 40px; line-height: 1; text-wrap: balance; margin-top: 20px; }
.pins { display: flex; justify-content: center; gap: 18px; padding-top: 14px; }
.pin { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--ink); }
.pin.on { background: var(--ink); }
.lock-msg { min-height: 1.5em; text-align: center; color: var(--red-text); font-weight: 500; }
.keys { display: grid; grid-template-columns: repeat(3, 76px); gap: 12px 22px; justify-content: center; }
.key { width: 76px; height: 76px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; font-family: var(--font-display); font-weight: 600; font-size: 32px; font-variant-numeric: tabular-nums; }
.key:active { background: var(--red-soft); }
.key:disabled { opacity: .4; }
.key.plain { border-color: transparent; background: transparent; }
.admin-box { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.code-form label { display: block; font-weight: 600; margin-bottom: 6px; }
.code-form .row { display: flex; flex-wrap: wrap; gap: 10px; }
.code-form input { flex: 1 1 120px; min-width: 0; min-height: 52px; border: 1.5px solid var(--muted); border-radius: 10px; background: var(--bg); color: var(--ink); font-family: var(--font-display); font-weight: 600; font-size: 26px; letter-spacing: .3em; padding: 0 14px; }
.code-form .btn-main { flex: 1 1 160px; width: auto; min-height: 52px; }
.admin-msg { min-height: 1.4em; font-weight: 500; }

/* player */
body.has-player .parts, body.has-player .home-list { padding-bottom: 190px; }
.player { position: fixed; left: 0; right: 0; bottom: 0; z-index: 8; background: var(--ink); color: var(--bg); padding-bottom: env(safe-area-inset-bottom, 0px); }
.player .wrap { padding-block: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
.p-top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.p-title { min-width: 0; flex: 1; font-weight: 600; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.p-time { flex: none; font-size: 14px; opacity: .8; font-variant-numeric: tabular-nums; }
#seek { width: 100%; margin: 0; height: 24px; accent-color: var(--tag); }
.p-btns { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
.p-btns button { min-width: 48px; min-height: 48px; border: 0; border-radius: 999px; background: transparent; color: inherit; display: inline-grid; place-items: center; font-weight: 600; font-size: 15px; font-variant-numeric: tabular-nums; }
.p-btns button:disabled { opacity: .35; }
.p-btns .pp { width: 58px; height: 58px; background: var(--red); color: var(--on-red); }
.p-btns button:focus-visible { outline-color: var(--tag); }
@media (min-width: 560px) { .home-top h1 { font-size: 54px; } .sop-head h1 { font-size: 46px; } }
@media (prefers-reduced-motion: no-preference) { .jobtag, .listen, .btn-main { transition: background-color .15s, filter .15s; } }
</style>

<div id="app"></div>

<div class="player" id="player" hidden>
  <div class="wrap">
    <div class="p-top"><span class="p-title" id="pTitle"></span><span class="p-time" id="pTime"></span></div>
    <input type="range" id="seek" min="0" max="1000" value="0">
    <div class="p-btns">
      <button type="button" id="bRate">1×</button>
      <button type="button" id="bPrev"><svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
      <button type="button" id="bPlay" class="pp"></button>
      <button type="button" id="bNext"><svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>
      <button type="button" id="bStop"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";
  // Titles are inlined so the list shows before data.json arrives. Order = most common job first, tests then repairs.
  var INDEX = [
    { id: "sop1", kind: "test", jobs: 86, en: "Fire Sprinkler Reg 4 5-Year Test", es: "Prueba de 5 años de rociadores, Reg 4" },
    { id: "sop2", kind: "test", jobs: 81, en: "Fire Alarm and Central Station Annual Test", es: "Prueba anual de alarma contra incendios y estación central" },
    { id: "sop3", kind: "test", jobs: 64, en: "Title 19 Annual Sprinkler Test", es: "Prueba anual de rociadores, Título 19" },
